<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cookie Jury imports browser cookie exports, assigns charges, lawyers, and verdicts, and clears guilty cookies through absurd penance tasks."
    />
    <meta name="theme-color" content="#151220" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🍪</text></svg>"
    />
    <title>Cookie Jury</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body,
      #root {
        min-height: 100vh;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at top left, rgba(255, 196, 115, 0.12), transparent 28%),
          radial-gradient(circle at bottom right, rgba(122, 92, 255, 0.16), transparent 34%),
          #151220;
        color: #f7efe3;
        font-family:
          "Avenir Next",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }

      .boot {
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 0.75rem;
        text-align: center;
        padding: 2rem;
      }

      .boot-cookie {
        font-size: 4rem;
        animation: boot-bounce 1.1s ease-in-out infinite;
      }

      .boot p {
        margin: 0;
        font-size: 1.05rem;
        letter-spacing: 0.02em;
        color: rgba(247, 239, 227, 0.82);
      }

      @keyframes boot-bounce {
        0%,
        100% {
          transform: translateY(0) rotate(-4deg);
        }
        50% {
          transform: translateY(-10px) rotate(4deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-live="polite">
        <div class="boot-cookie" aria-hidden="true">🍪</div>
        <p>Convening the Cookie Jury…</p>
      </div>
    </div>
    <noscript>
      Cookie Jury needs JavaScript to import cookies, review evidence, and swing the gavel.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
